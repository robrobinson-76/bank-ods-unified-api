[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
markers =
    ingest: end-to-end ingestion test; requires the full compose stack
        (kafka, schema-registry, connect, postgres-crm). Auto-skipped when the
        stack is unreachable. Run with: pytest -m ingest
